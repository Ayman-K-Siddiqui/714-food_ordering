{% extends "base.html" %}
{% block title %}Create account · Food Ordering{% endblock %}
{% block content %}
    <section class="auth-card">
        <h1>Create an account</h1>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="first_name">First name</label>
            <input id="first_name" name="first_name" type="text" autocomplete="given-name" maxlength="50" value="{{ form_data.first_name }}">
            <label for="last_name">Last name</label>
            <input id="last_name" name="last_name" type="text" autocomplete="family-name" maxlength="50" value="{{ form_data.last_name }}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="100" value="{{ form_data.email }}" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </section>
{% endblock %}
